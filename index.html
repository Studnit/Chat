<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction Analytics Pro</title>

<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --primary: #38bdf8;
  --border-color: rgba(255, 255, 255, 0.3);
  --success-bg: #064e3b;
  --success-text: #34d399;
  --error-bg: #7f1d1d;
  --error-text: #f87171;
  --neutral-bg: #334155;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background-color: var(--bg);
  color: #f1f5f9;
  padding: 40px;
  line-height: 1.6;
}

.container { max-width: 1100px; margin: auto; }

.header-section { text-align: center; margin-bottom: 40px; }

.search-container {
  display: flex; gap: 12px; justify-content: center; margin-bottom: 20px;
}

input {
  background: var(--card);
  border: 1px solid var(--primary);
  padding: 14px;
  border-radius: 10px;
  color: white;
  width: 350px;
  font-size: 16px;
  transition: 0.3s;
}

input:focus { outline: none; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.3); }

button {
  background: var(--primary);
  color: #0f172a;
  border: none;
  padding: 14px 28px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover { transform: translateY(-2px); opacity: 0.9; }

.data-wrapper {
  background: var(--card);
  border-radius: 18px;
  padding: 35px;
  margin-top: 20px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255,255,255,0.05);
}

/* SECTIONING */
.section-container {
  margin-bottom: 35px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding-bottom: 25px;
}

.section-container:last-child { border: none; }

.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 20px;
}

/* TABLE ENHANCEMENTS */
.report-table {
  width: 100%;
  border-collapse: collapse;
  margin: 15px 0;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border-color);
}

.report-table th, .report-table td {
  border: 1px solid var(--border-color);
  padding: 14px;
}

.report-table th {
  background: rgba(56, 189, 248, 0.15);
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* Label column (first one) */
.report-table td:first-child {
  background: rgba(255,255,255,0.03);
  font-weight: bold;
  color: #94a3b8;
  width: 25%;
}

/* PILLS */
.pill {
  padding: 5px 12px;
  border-radius: 6px;
  font-weight: 800;
  font-size: 0.85rem;
  display: inline-block;
  font-family: 'Courier New', monospace;
}

.pill-success { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-text); }
.pill-error { background: var(--error-bg); color: var(--error-text); border: 1px solid var(--error-text); }

/* AI QUOTES / NOTES */
.ai-quote {
  border-left: 4px solid var(--primary);
  background: rgba(56, 189, 248, 0.07);
  padding: 15px 20px;
  margin: 15px 0;
  border-radius: 0 10px 10px 0;
  color: #cbd5e1;
}

.highlight-blue { color: var(--primary); font-weight: bold; }
.highlight-green { color: #34d399; font-weight: bold; }
.highlight-yellow { color: #facc15; font-weight: bold; }

/* LOADER */
.loader {
  border: 3px solid #f3f3f3;
  border-top: 3px solid var(--primary);
  border-radius: 50%;
  width: 20px;
  height: 20px;
  animation: spin 1s linear infinite;
  display: inline-block;
}

@keyframes spin { 100% { transform: rotate(360deg); } }

</style>
</head>

<body>

<div class="container">
  <div class="header-section">
    <h2>💳 <span style="font-weight: 300;">Aurus</span> Transaction Audit</h2>

    <div class="search-container">
      <input id="txnId" value="295260853503884501" placeholder="Enter Transaction ID">
      <button onclick="callAPI()">Run Analysis</button>
    </div>

    <div id="status"></div>
  </div>

  <div id="output" class="data-wrapper" style="display:none;"></div>
</div>

<script>

// 🔥 SPECIAL TEXT FORMATTER
function formatSpecialText(text) {
  if (!text) return "";

  let formatted = text.replace(/\\n/g, "\n").trim();

  // Bold **text**
  formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<span class="highlight-blue">$1</span>');

  // Italics / Note /*text*/
  formatted = formatted.replace(/\/\*(.*?)\*\//g, '<span class="highlight-yellow">$1</span>');

  // Success highlights 'text'
  formatted = formatted.replace(/'(.*?)'/g, '<span class="highlight-green">$1</span>');

  // Inline Code `text`
  formatted = formatted.replace(/`(.*?)`/g, '<code style="background:#0f172a; padding:3px 7px; border-radius:5px; color:#facc15; font-size:0.9em;">$1</code>');

  // Blockquotes > text
  if (formatted.startsWith(">")) {
    return `<div class="ai-quote">${formatted.substring(1).trim()}</div>`;
  }

  return formatted;
}

// 🔥 AUTO-ICON DETECTOR
function getIcon(title) {
  const t = title.toLowerCase();
  if (t.includes("analysis")) return "🧠";
  if (t.includes("result") || t.includes("status")) return "📊";
  if (t.includes("suggestion") || t.includes("fix") || t.includes("action")) return "💡";
  if (t.includes("raw") || t.includes("log")) return "📝";
  return "🔹";
}

// 🔥 CELL FORMAT
function formatCellContent(content) {
  const raw = content.trim();
  const text = formatSpecialText(raw);

  // Success Codes
  if (raw === "00" || raw === "000" || raw.toLowerCase() === "approved") {
    return `<span class="pill pill-success">${raw}</span>`;
  }

  // Error Codes (2-3 digits or decline text)
  if (/^\d{2,3}$/.test(raw) || raw.toLowerCase().includes("decline") || raw.toLowerCase().includes("error")) {
    return `<span class="pill pill-error">${raw}</span>`;
  }

  return text;
}

// 🔥 TABLE GENERATOR
function generateTable(markdown) {
  const rows = markdown.split("\n").filter(r => r.includes("|"));
  if (rows.length === 0) return "";

  let html = `<table class="report-table">`;
  const dataRows = rows.filter(r => !r.includes("---"));

  dataRows.forEach((row, index) => {
    const cols = row.split("|").filter(c => c.trim() !== "");
    html += "<tr>";

    cols.forEach(col => {
      const isHeader = (index === 0);
      const content = isHeader ? col.trim() : formatCellContent(col);
      html += isHeader ? `<th>${content}</th>` : `<td>${content}</td>`;
    });

    html += "</tr>";
  });

  html += "</table>";
  return html;
}

// 🔥 MAIN PARSER
function parseMarkdown(text) {
  const sections = text.split("###");
  let html = "";

  sections.forEach(sec => {
    if (!sec.trim()) return;

    const lines = sec.trim().split("\n");
    const title = lines.shift().trim();
    const icon = getIcon(title);

    html += `<div class="section-container">
               <div class="section-header">${icon} ${formatSpecialText(title)}</div>`;

    let tableBuffer = [];

    lines.forEach(line => {
      if (line.includes("|")) {
        tableBuffer.push(line);
      } else {
        if (tableBuffer.length) {
          html += generateTable(tableBuffer.join("\n"));
          tableBuffer = [];
        }

        const formattedLine = formatSpecialText(line);
        if (formattedLine) {
          html += formattedLine.startsWith("<div") ? formattedLine : `<p style="margin: 12px 0;">${formattedLine}</p>`;
        }
      }
    });

    if (tableBuffer.length) {
      html += generateTable(tableBuffer.join("\n"));
    }

    html += `</div>`;
  });

  return html;
}

// 🔥 API CALL
async function callAPI() {
  const txnId = document.getElementById("txnId").value;
  const status = document.getElementById("status");
  const output = document.getElementById("output");

  status.innerHTML = `<span class="loader"></span> Scanning Transaction Hub...`;
  output.style.display = "none";

  try {
    const res = await fetch(`http://10.192.13.230:5678/webhook-test/txn-analysis?txnId=${txnId}`);
    const data = await res.json();

    const aiText = data.prettyOutput || data.aiAnalysis?.raw || "No analysis available.";

    output.innerHTML = parseMarkdown(aiText);
    output.style.display = "block";

    status.innerHTML = "✅ Audit Complete";
  } catch (e) {
    status.innerHTML = "❌ Connection Failed";
  }
}

</script>

</body>
</html>
